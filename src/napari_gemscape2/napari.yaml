name: napari-gemscape2
display_name: GEMscape2
visibility: hidden
categories: ["Utilities", "Visualization"]
contributions:
  commands:
    - id: napari-gemscape2.get_nd2_reader
      title: Open Nikon .nd2
      python_name: napari_gemscape2.readers.nd2:get_reader
    - id: napari-gemscape2.get_ims_reader
      title: Open Imaris .ims
      python_name: napari_gemscape2.readers.ims:get_reader
    - id: napari-gemscape2.ExperimentListWidget
      title: Experiment list
      python_name: napari_gemscape2.widgets.experiment_list:ExperimentListWidget
    - id: napari-gemscape2.DiffusionAnalysisWidget
      title: Diffusion analysis
      python_name: napari_gemscape2.widgets.diffusion_panel:DiffusionAnalysisWidget
    - id: napari-gemscape2.FrameExportWidget
      title: Screenshots and frames
      python_name: napari_gemscape2.widgets.frame_export:FrameExportWidget
  widgets:
    - command: napari-gemscape2.ExperimentListWidget
      display_name: Experiment list
    - command: napari-gemscape2.DiffusionAnalysisWidget
      display_name: Diffusion analysis
    - command: napari-gemscape2.FrameExportWidget
      display_name: Screenshots and frames
  readers:
    - command: napari-gemscape2.get_nd2_reader
      filename_patterns: ["*.nd2"]
      accepts_directories: false
    - command: napari-gemscape2.get_ims_reader
      filename_patterns: ["*.ims"]
      accepts_directories: false
