[build-system]
requires = ["setuptools>=64.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "napari-gemscape2"
version = "0.1.0"
description = "napari plugin for single-particle tracking: spotsolve (localization/tracking) and diffusionkit (diffusion analysis)"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "Daniel Elnatan", email = "delnatan@gmail.com" }]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Framework :: napari",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "numpy",
    "polars>=1.0.0",
    "tifffile",
    "nd2",
    "h5py",
    "typer",
    "natsort",
    "qtpy",
    "napari[pyqt6]",
    # One distribution with the Rust extension (`spotsolve_rs`) bundled.
    "spotsolve",
    "diffusionkit",
    "qtkit",
]

[project.optional-dependencies]
# Per-track NUTS in the diffusion widget (`diffusionkit.bayes.fit_track`).
# Optional: it pulls in JAX/NumPyro, and the widget runs without it.
bayes = ["diffusionkit[bayes,plots]"]

[project.scripts]
gemscape2 = "napari_gemscape2.cli:main"

[project.entry-points."napari.manifest"]
napari-gemscape2 = "napari_gemscape2:napari.yaml"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["*.yaml"]

[tool.uv.sources]
# maturin builds the Rust extension from the sibling checkout; a Rust
# change needs a re-sync (`uv sync --reinstall-package spotsolve`).
spotsolve = { path = "../spotsolve", editable = true }
diffusionkit = { path = "../diffusionkit", editable = true }
# Developed on its own (and as an editable member of the microscopy
# workspace); this follows its main branch, and `uv lock --upgrade-package
# qtkit` is what brings a newer commit in.
qtkit = { git = "https://github.com/delnatan/qtkit.git", branch = "main" }
