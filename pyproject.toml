[build-system]
requires = ["setuptools>=64.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "napari-gemscape2"
version = "0.1.0"
description = "napari plugin for single-particle tracking: spotsolve (localization/tracking) and diffusionkit (diffusion analysis)"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "Daniel Elnatan", email = "delnatan@gmail.com" }]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Framework :: napari",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "numpy",
    "polars>=1.0.0",
    "tifffile",
    "nd2",
    "h5py",
    "typer",
    "natsort",
    "qtpy",
    "napari[pyqt6]",
    # One distribution with the Rust extension (`spotsolve_rs`) bundled.
    "spotsolve",
    "diffusionkit",
    "qtkit",
]

[project.optional-dependencies]
# Per-track NUTS in the diffusion widget (`diffusionkit.bayes.fit_track`).
# Optional: it pulls in JAX/NumPyro, and the widget runs without it.
bayes = ["diffusionkit[bayes,plots]"]

[project.scripts]
gemscape2 = "napari_gemscape2.cli:main"

[project.entry-points."napari.manifest"]
napari-gemscape2 = "napari_gemscape2:napari.yaml"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["*.yaml"]

[tool.uv.sources]
# The standard install: no Rust toolchain and no sibling checkouts. spotsolve
# comes from its GitHub release -- one abi3 wheel per platform, picked by
# marker -- and falls back to the release's sdist (which needs Rust) anywhere
# else, rather than to PyPI, where the name is not ours. To bump it, change
# the version in every URL below and re-run `uv lock`.
#
# For development against local checkouts of spotsolve/diffusionkit/qtkit,
# use the workspace in dev/ instead (see README "Setup"); it overrides all
# three sources.
spotsolve = [
    { url = "https://github.com/delnatan/spotsolve/releases/download/v0.1.0/spotsolve-0.1.0-cp39-abi3-macosx_11_0_arm64.whl", marker = "sys_platform == 'darwin' and platform_machine == 'arm64'" },
    { url = "https://github.com/delnatan/spotsolve/releases/download/v0.1.0/spotsolve-0.1.0-cp39-abi3-macosx_10_12_x86_64.whl", marker = "sys_platform == 'darwin' and platform_machine == 'x86_64'" },
    { url = "https://github.com/delnatan/spotsolve/releases/download/v0.1.0/spotsolve-0.1.0-cp39-abi3-manylinux_2_17_x86_64.manylinux2014_x86_64.whl", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
    { url = "https://github.com/delnatan/spotsolve/releases/download/v0.1.0/spotsolve-0.1.0-cp39-abi3-manylinux_2_17_aarch64.manylinux2014_aarch64.whl", marker = "sys_platform == 'linux' and platform_machine == 'aarch64'" },
    { url = "https://github.com/delnatan/spotsolve/releases/download/v0.1.0/spotsolve-0.1.0-cp39-abi3-win_amd64.whl", marker = "sys_platform == 'win32' and platform_machine == 'AMD64'" },
    { url = "https://github.com/delnatan/spotsolve/releases/download/v0.1.0/spotsolve-0.1.0.tar.gz", marker = "(sys_platform != 'darwin' or platform_machine != 'arm64') and (sys_platform != 'darwin' or platform_machine != 'x86_64') and (sys_platform != 'linux' or platform_machine != 'x86_64') and (sys_platform != 'linux' or platform_machine != 'aarch64') and (sys_platform != 'win32' or platform_machine != 'AMD64')" },
]
# Pure Python; follows main, and uv.lock pins the commit. Note that PyPI's
# `diffusionkit` is an unrelated package, so this source must stay.
diffusionkit = { git = "https://github.com/delnatan/diffusionkit.git", branch = "main" }
# Follows main likewise; `uv lock --upgrade-package qtkit` brings a newer
# commit in.
qtkit = { git = "https://github.com/delnatan/qtkit.git", branch = "main" }
