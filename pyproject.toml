[build-system]
requires = ["setuptools>=64.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spt-pipeline"
version = "0.1.0"
description = "Batch orchestration + napari QC viewer connecting spotsolve (localization/tracking) and diffusionkit (diffusion analysis)"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "Daniel Elnatan", email = "delnatan@gmail.com" }]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Framework :: napari",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "numpy",
    "polars>=1.0.0",
    "tifffile",
    "nd2",
    "h5py",
    "typer",
    "natsort",
    "qtpy",
    "napari[pyqt6]",
    "spotsolve",
    # The Rust extension `spotsolve` needs at import time. Not published:
    # built from the sibling crate at ../spotsolve/rust/spotsolve-py (see
    # [tool.uv.sources]), which is why it is named here explicitly rather
    # than pulled in as one of spotsolve's own dependencies.
    "spotsolve-rs",
    # The [nested] extra (jaxns) is not optional for this project: the
    # diffusion widget's Anisotropy tab calls diffusionkit.bayes.anisotropy,
    # whose per-track evidence now comes from nested sampling. jaxns is
    # imported lazily inside the fit, so without the extra the tab imports
    # fine and then fails on the first run -- exactly the failure mode worth
    # spending a dependency to avoid.
    "diffusionkit[nested]",
    "qtkit",
]

[project.scripts]
spt = "spt_pipeline.cli:main"

[project.entry-points."napari.manifest"]
spt-pipeline = "spt_pipeline:napari.yaml"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["*.yaml"]

[tool.uv.sources]
spotsolve = { path = "../spotsolve", editable = true }
# Not editable: a compiled extension has nothing to pick up from the
# source tree, and a plain path install builds it via maturin in release.
spotsolve-rs = { path = "../spotsolve/rust/spotsolve-py" }
diffusionkit = { path = "../diffusionkit", editable = true }
# Developed on its own (and as an editable member of the microscopy
# workspace); this follows its main branch, and `uv lock --upgrade-package
# qtkit` is what brings a newer commit in.
qtkit = { git = "https://github.com/delnatan/qtkit.git", branch = "main" }
